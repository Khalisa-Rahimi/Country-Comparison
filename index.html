<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Country Comparison</title>
    <style>
        body {
         font-family: Arial; 
         background: #258c36;
          padding: 40px;
         }
        .container {
         background: white;
          padding: 30px; 
          border-radius: 12px; 
          max-width: 500px;
           margin: auto;
         }
        h1 { 
        text-align: center; 
        color: #333333; 
    }
        input {
             width: 100%;
             padding: 10px;
              margin: 8px 0; 
              border: 2px solid #ddd; 
              border-radius: 6px;
               box-sizing: border-box;
             }
        button {
             width: 100%; 
             padding: 12px; 
             background: #66ea7c;
              color: white;
               border: none; 
               border-radius: 6px;
                cursor: pointer; 
                font-size: 16px; }
        button:hover {
             background: #5568d3;
             }
        #result {
             margin-top: 20px;
              padding: 15px; 
              border-radius: 6px;
               display: none;
             }
        .success {
             background: #e8f5e9;
              color: #2e7d32;
               border-left: 4px solid #4caf50;
             }
        .error {
             background: #ffebee;
              color: #c62828;
               border-left: 4px solid #f44336;
             }
    </style>
</head>
<body>
    <div class="container">
        <h1> Compare Countries</h1>
        <input type="text" id="countryA" placeholder="First country" value="Afghanistan">
        <input type="text" id="countryB" placeholder="Second country" value="Pakistan">
        <button onclick="runComparison()">Compare</button>
        <div id="result"></div>
    </div>

    <script>
        async function compareCountries(nameA, nameB) {
            const result = document.getElementById("result");
            result.style.display = "block";
            result.textContent = "Loading...";

            try {
                //  Fetch data from local JSON file
                const response = await fetch("countries.json");

                if (!response.ok) {
                    throw new Error(`Failed to load data (Status: ${response.status})`);
                }

                const countries = await response.json();

                // Get population for each country
                const dataA = countries[nameA];
                if (!dataA) throw new Error(`Country "${nameA}" not found`);

                const dataB = countries[nameB];
                if (!dataB) throw new Error(`Country "${nameB}" not found`);

                const populationA = dataA.population;
                const populationB = dataB.population;

                //  Compare 
                let message;
                if (populationA > populationB) {
                    const diff = populationA - populationB;
                    message = `${nameA} has ${diff.toLocaleString()} more people than ${nameB}.`;
                } else if (populationB > populationA) {
                    const diff = populationB - populationA;
                    message = `${nameB} has ${diff.toLocaleString()} more people than ${nameA}.`;
                } else {
                    message = `${nameA} and ${nameB} have the same population.`;
                }

                result.className = "success";
                result.textContent = message;
                console.log(message);

            } catch (error) {
                result.className = "error";
                result.textContent = " Error: " + error.message;
                console.error(" Error comparing countries:", error.message);
            }
        }

        function runComparison() {
            const a = document.getElementById("countryA").value.trim();
            const b = document.getElementById("countryB").value.trim();
            compareCountries(a, b);
        }
    </script>
</body>
</html>
